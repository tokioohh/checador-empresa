# Servicios activos en esta fase: postgres + api.
# admin-web y tv-webapp se agregan aquí cuando esas apps existan (próximas fases).
services:
  postgres:
    image: postgres:16-alpine
    container_name: checador_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: checador_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      QR_SECRET: ${QR_SECRET}
      PORT: 4000
      STORAGE_PATH: /app/storage
      ACTIVATION_CODE_TTL_HOURS: ${ACTIVATION_CODE_TTL_HOURS:-4}
      PUNTUALIDAD_TOLERANCIA_MIN: ${PUNTUALIDAD_TOLERANCIA_MIN:-15}
    ports:
      - "4000:4000"
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
